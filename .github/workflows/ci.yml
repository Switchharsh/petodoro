name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo test --release --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu, so the glibc requirement suits Mint 21+.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - name: Lint for this platform
        run: cargo clippy --release --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: startsWith(matrix.name, 'linux')
        run: |
          cargo build --release --locked
          arch="$(dpkg --print-architecture)"
          tarname="$([ "$arch" = amd64 ] && echo x86_64 || echo arm64)"
          mkdir -p dist/petodoro
          cp target/release/petodoro README.md LICENSE install.sh uninstall.sh dist/petodoro/
          tar -C dist -czf "petodoro-${tarname}-linux.tar.gz" petodoro
          deb="$(scripts/build-deb.sh target/release/petodoro "${{ steps.v.outputs.version }}" .)"
          # Fixed names so README links to releases/latest/download/ always work.
          mv "$deb" "petodoro-${arch}.deb"
          mkdir -p out && mv ./*.tar.gz ./*.deb out/

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p out && cp target/release/petodoro.exe out/petodoro-windows.exe

      - name: Package (macOS, universal app)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output petodoro \
            target/aarch64-apple-darwin/release/petodoro target/x86_64-apple-darwin/release/petodoro
          mkdir -p out
          scripts/build-macos-app.sh ./petodoro "${{ steps.v.outputs.version }}" out

      - uses: actions/upload-artifact@v4
        with:
          name: petodoro-${{ matrix.name }}
          path: out/*

  # Every push to the default branch (re)publishes the release for the
  # version in Cargo.toml; bump the version to start a new release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Petodoro v${{ steps.v.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Download

            | System | File | How |
            |---|---|---|
            | **Linux Mint / Ubuntu** (21+/22.04+) | `petodoro-amd64.deb` | double-click → *Install Package* |
            | Linux on ARM (Raspberry Pi…) | `petodoro-arm64.deb` | `sudo apt install ./petodoro-arm64.deb` |
            | **Windows** 10/11 | `petodoro-windows.exe` | double-click (if SmartScreen warns: *More info → Run anyway*) |
            | **macOS** 11+ | `petodoro-macos.zip` | unzip, move *Petodoro.app* to Applications, right-click → *Open* the first time |
            | Any Linux, no install | `petodoro-x86_64-linux.tar.gz` | unpack, run `./petodoro` |

            Right-click the pet for the menu: choose a pet, pomodoro / stopwatch, themes, settings.
          files: out/*
