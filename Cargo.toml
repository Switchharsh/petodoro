[package]
name = "petodoro"
version = "0.3.1"
edition = "2021"
description = "A tiny floating desktop pet with a pomodoro timer and a stopwatch"
license = "MIT"
readme = "README.md"
rust-version = "1.75"

[dependencies]
# CPU 2D rasterizer used to draw the pets.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
libc = "0.2"

# Linux / BSD: pure-Rust X11 client, no libX11 / -dev packages needed to build.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
